name: Destroy

# Tears down an environment (everything except the state bucket / deploy role).
#   gh workflow run destroy.yml -f env=dev -f confirm=dev
# Humans only: Claude is not allowed to trigger this (see .claude/settings.json).
on:
  workflow_dispatch:
    inputs:
      env:
        type: choice
        options: [dev, prod]
      confirm:
        description: Type the environment name again to confirm
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - uses: actions/checkout@v5
        with: { sparse-checkout: devops, sparse-checkout-cone-mode: true }
      - id: check
        run: |
          if [ -f devops/project.env ]; then echo "configured=true" >> "$GITHUB_OUTPUT"
          else echo "configured=false" >> "$GITHUB_OUTPUT"; echo "::notice::Not set up yet. Run the 'Setup (one-time)' workflow first."; fi

  destroy:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    steps:
      - name: Confirm
        if: inputs.confirm != inputs.env
        run: |
          echo "::error::confirm must equal env ('${{ inputs.env }}')"
          exit 1
      - uses: actions/checkout@v5
      - name: Load project settings
        run: grep -E '^[A-Z_]+=' devops/project.env >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "~1.13", terraform_wrapper: false }
      - run: devops/scripts/tf.sh "${{ inputs.env }}" destroy -auto-approve
